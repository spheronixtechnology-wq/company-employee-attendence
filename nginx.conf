# ──────────────────────────────────────────────────────────────────────────────
# Nginx Configuration for Spheronix Attendance System
# Place this file at: /etc/nginx/sites-available/attendance-system
# Then: sudo ln -s /etc/nginx/sites-available/attendance-system /etc/nginx/sites-enabled/
# Run Certbot after: sudo certbot --nginx -d admin.spheronixtechnology.in -d manager.spheronixtechnology.in -d employee.spheronixtechnology.in -d api.spheronixtechnology.in
# ──────────────────────────────────────────────────────────────────────────────

# Rate limiting zones (defined at http level — add to nginx.conf http block or use here)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ── API Backend ─────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.spheronixtechnology.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.spheronixtechnology.in;

    # SSL — managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.spheronixtechnology.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.spheronixtechnology.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    # Auth endpoints — stricter rate limit
    location /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    # General API — standard rate limit
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    # Uploads — serve directly from Nginx for performance
    location /uploads/ {
        alias /home/ubuntu/attendance-system/apps/api/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Prevent executing uploaded files
        add_header X-Content-Type-Options "nosniff";
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            application/pdf pdf;
        }
    }

    # WebSocket / Socket.io
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}

# ── Admin Frontend ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.spheronixtechnology.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.spheronixtechnology.in;

    ssl_certificate /etc/letsencrypt/live/admin.spheronixtechnology.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.spheronixtechnology.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /home/ubuntu/attendance-system/apps/admin/dist;
    index index.html;

    # SPA — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend (avoids CORS entirely)
    location /api/ {
        proxy_pass https://api.spheronixtechnology.in;
        proxy_set_header Host api.spheronixtechnology.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io to the backend
    location /socket.io/ {
        proxy_pass https://api.spheronixtechnology.in;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.spheronixtechnology.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

